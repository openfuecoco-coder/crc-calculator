<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>CRC-32 計算器</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #FDFBF7; color: #4A4036; display: flex; justify-content: center; padding: 20px; box-sizing: border-box; min-height: 100vh; }
        .container { background-color: #E8E4D9; padding: 2rem; border-radius: 12px; width: 100%; max-width: 500px; box-sizing: border-box; }
        h1 { text-align: center; color: #4A4036; margin-top: 0; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        select, textarea, button { width: 100%; padding: 12px; border: 1px solid #C4B5A5; border-radius: 8px; background: #FDFBF7; color: #4A4036; box-sizing: border-box; font-size: 1rem; }
        button { background-color: #C4B5A5; color: #FDFBF7; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #A39688; }
        #crcResult { background: #FDFBF7; padding: 15px; border-radius: 8px; border: 1px solid #C4B5A5; text-align: center; font-weight: bold; margin-top: 20px; min-height: 1.2em; word-break: break-all; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CRC-32 計算器</h1>
        <div class="form-group">
            <label>輸入類型</label>
            <select id="inputType"><option value="text">文字 (Text)</option><option value="hex">十六進位 (HEX)</option></select>
        </div>
        <div class="form-group">
            <label>輸入內容</label>
            <textarea id="inputText" rows="4" placeholder="請輸入內容..."></textarea>
        </div>
        <button onclick="calculate()">計算 CRC-32</button>
        <div id="crcResult">結果顯示區</div>
    </div>
    <script>
        function crc32(str) {
            let crc = 0xFFFFFFFF;
            for (let i = 0; i < str.length; i++) {
                crc ^= str.charCodeAt(i);
                for (let j = 0; j < 8; j++) crc = (crc >>> 1) ^ (crc & 1 ? 0xEDB88320 : 0);
            }
            return (crc ^ 0xFFFFFFFF) >>> 0;
        }
        function calculate() {
            const input = document.getElementById('inputText').value;
            const type = document.getElementById('inputType').value;
            let val;
            if (type === 'hex') {
                let hexInput = input.replace(/[\s]/g, '');
                if (hexInput.length % 2 !== 0) { alert("HEX 輸入必須是偶數長度。"); return; }
                let bytes = [];
                try {
                    for (let i = 0; i < hexInput.length; i += 2) {
                        bytes.push(String.fromCharCode(parseInt(hexInput.substring(i, i + 2), 16)));
                    }
                    val = crc32(bytes.join(''));
                } catch (e) { alert("HEX 格式錯誤。"); return; }
            } else {
                val = crc32(input);
            }
            document.getElementById('crcResult').innerText = "CRC-32: 0x" + val.toString(16).toUpperCase().padStart(8, '0');
        }
    </script>
</body>
</html>
